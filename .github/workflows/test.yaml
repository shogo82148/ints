name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version:
          - "1.27"
          - "1.26"
          - "1.25"
          - "1.24"
        os:
          - "ubuntu-26.04"
        arch:
          - "amd64"
        include:
          - os: "ubuntu-26.04"
            go-version: "1.27"
            arch: "386" # int has 32-bit
          - os: "ubuntu-26.04-arm"
            go-version: "1.27"
            arch: "arm64"

    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: go test -coverprofile=cover.out ./...
        env:
          GOARCH: ${{ matrix.arch }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: shogo82148/ints
